[package]
name = "valet"
version = "0.1.0"
edition = "2024"
description = "A personal developer CLI framework: repos, worktrees, agent hooks, background jobs."
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
pulldown-cmark = { version = "=0.13.6", default-features = false }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.1"

[profile.release]
strip = true
lto = "thin"
