# tmux: one file. The `tmux` command (Userland Tmux app) passes -f with its
# Settings/tmux.conf, a link to this file.
# Prefix is Ctrl-a (Ctrl-b still works). Dracula colours.

# --- Basics ------------------------------------------------------------------
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # 24-bit colour
set -g mouse on
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Keys --------------------------------------------------------------------
bind r source-file -F "#{config_files}" \; display "reloaded #{config_files}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind c new-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind + resize-pane -Z
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
bind a setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Look (Dracula) ----------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#282a36,fg=#7d83a6"
set -g status-left-length 40
set -g status-left "#[fg=#282a36,bg=#{?client_prefix,#ff79c6,#bd93f9},bold] ❐ #S #[default] "
set -g status-right "#{?pane_synchronized,#[fg=#ff5555]SYNC ,}#{?mouse,,#[fg=#ffb86c]no-mouse }#[fg=#f8f8f2,bg=#6272a4] %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#282a36,bg=#ff79c6,bold] #I #W "
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#ff79c6"
set -g message-style "fg=#282a36,bg=#f1fa8c"
setw -g mode-style "fg=#282a36,bg=#bd93f9"
